name = "etwedding"
compatibility_date = "2026-10-01"
pages_build_output_dir = "./dist"

[vars]
# Responses can be changed until this moment, then the link becomes read-only.
RSVP_DEADLINE = "2026-12-15T23:59:59+02:00"  # Cyprus time
# Used to build personal links in the admin "Send" tab and CSV export.
SITE_URL = "https://etwedding.pages.dev"

# Secrets (set with `wrangler pages secret put NAME`, and in .dev.vars locally):
#   SITE_PASSWORD   shared password for the public front page
#   ADMIN_PASSWORD  password for /admin
#   SESSION_SECRET  long random string used to sign cookies

[[d1_databases]]
binding = "DB"
database_name = "wedding"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"
